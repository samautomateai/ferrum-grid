name: Bootstrap lockfile
on:
  push:
    branches: [m0/quality-foundation]
    paths: [.github/workflows/bootstrap-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'build: record resolved dependency lockfile'
          git push origin HEAD:refs/heads/m0/quality-foundation
